<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TIC Carrier Club | Institutional Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --bg-indigo: #0F172A;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #475569;
            --border-soft: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(15, 23, 42, 0.4);
            --tic-blue: #0ea5e9; /* Sky-500 */
            --spotlight-opacity: 0.6;
        }

        html.light {
            --bg-deep: #ffffff;
            --bg-indigo: #F1F5F9;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-soft: rgba(15, 23, 42, 0.18);
            --card-bg: rgba(255, 255, 255, 0.6);
            --tic-blue: #0ea5e9;
            --spotlight-opacity: 0.25;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent; 
            color: var(--text-primary);
            margin: 0;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 0px; }

        /* The Static Background Layer */
        .background-system {
            position: fixed;
            inset: 0;
            background-color: var(--bg-deep);
            z-index: -10;
            overflow: hidden;
            transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* The Main Dramatic Spotlight - Top Left Focus */
        .spotlight-primary {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 140vw;
            height: 140vh;
            background: radial-gradient(
                circle at 20% 20%,
                var(--tic-blue) 0%,
                rgba(14, 165, 233, 0.1) 25%,
                transparent 50%
            );
            filter: blur(100px);
            opacity: var(--spotlight-opacity);
            pointer-events: none;
        }

        /* Secondary Rim Light - Bottom Right Depth */
        .spotlight-secondary {
            position: absolute;
            bottom: -30%;
            right: -10%;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(
                circle at 80% 80%,
                var(--tic-blue) 0%,
                transparent 55%
            );
            filter: blur(120px);
            opacity: calc(var(--spotlight-opacity) * 0.4);
            pointer-events: none;
        }

        /* Global Center Wash to lift content */
        .ambient-wash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160vw;
            height: 160vh;
            background: radial-gradient(
                circle at center,
                rgba(14, 165, 233, 0.03) 0%,
                transparent 80%
            );
            pointer-events: none;
        }

        .noise {
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3%3Cfilter id='n'%3%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3%3C/filter%3%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: overlay;
        }

        .tic-hero-gradient {
            background: linear-gradient(135deg, var(--tic-blue) 0%, #2563eb 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            display: inline-block;
        }

        /* Glassmorphism helper */
        .glass {
            backdrop-filter: blur(20px) saturate(180%);
            background-color: var(--card-bg);
            border: 1px solid var(--border-soft);
        }
    </style>
